name: Release Android app

on:
  push:
    tags:
      - "v*"
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to publish or repair (e.g. v1.1)"
        required: true
        type: string

# Tag pushes, manually published GitHub Releases, and manual recoveries can
# overlap. Queue them rather than cancel a release halfway through uploading.
concurrency:
  group: android-release-${{ inputs.tag || github.event.release.tag_name || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  preflight:
    name: Verify immutable release tag and source
    runs-on: ubuntu-24.04
    outputs:
      release_tag: ${{ steps.resolve.outputs.release_tag }}
      tagged_sha: ${{ steps.ancestry.outputs.tagged_sha }}
      pipeline_sha: ${{ steps.revision.outputs.pipeline_sha }}
    steps:
      - name: Resolve release tag
        id: resolve
        env:
          MANUAL_TAG: ${{ inputs.tag || '' }}
          RELEASE_EVENT_TAG: ${{ github.event.release.tag_name || '' }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            tag="$MANUAL_TAG"
          elif [[ "$GITHUB_EVENT_NAME" == "release" ]]; then
            tag="$RELEASE_EVENT_TAG"
          else
            if [[ "$GITHUB_REF_TYPE" != "tag" ]]; then
              echo "::error title=Not a version tag::Expected a tag push."
              exit 1
            fi
            tag="$GITHUB_REF_NAME"
          fi
          if [[ -z "$tag" ]]; then
            echo "::error title=Missing release tag::Provide an existing tag, for example v1.1."
            exit 1
          fi
          echo "release_tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Check out trusted release scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: pipeline

      - name: Pin the trusted release automation to this commit
        id: revision
        run: echo "pipeline_sha=$(git -C pipeline rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Validate release tag syntax
        working-directory: pipeline
        env:
          RELEASE_TAG: ${{ steps.resolve.outputs.release_tag }}
        run: bash tools/check_release_tag.sh "$RELEASE_TAG"

      - name: Check out exact tagged application sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: refs/tags/${{ steps.resolve.outputs.release_tag }}
          fetch-depth: 0
          path: app-source

      - name: Require a tag pointing into reviewed main history
        id: ancestry
        working-directory: app-source
        env:
          RELEASE_TAG: ${{ steps.resolve.outputs.release_tag }}
        run: |
          tagged_sha="$(git rev-parse HEAD)"
          expected_sha="$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")"
          if [[ "$tagged_sha" != "$expected_sha" ]]; then
            echo "::error title=Wrong source checkout::Requested tag did not resolve to the checked-out commit."
            exit 1
          fi
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$tagged_sha" FETCH_HEAD; then
            echo "::error title=Unreviewed release source::Tag $RELEASE_TAG must point to a commit already merged into main."
            exit 1
          fi
          echo "tagged_sha=$tagged_sha" >> "$GITHUB_OUTPUT"
          echo "Validated $RELEASE_TAG at $tagged_sha."

  release:
    name: Test, sign, attest, and publish
    needs: preflight
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: write
      attestations: write
      id-token: write
    env:
      RELEASE_TAG: ${{ needs.preflight.outputs.release_tag }}
      TAGGED_SHA: ${{ needs.preflight.outputs.tagged_sha }}
      PIPELINE_SHA: ${{ needs.preflight.outputs.pipeline_sha }}

    steps:
      - name: Require Android signing secrets
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          for name in ANDROID_KEYSTORE_BASE64 RELEASE_STORE_PASSWORD RELEASE_KEY_ALIAS RELEASE_KEY_PASSWORD; do
            if [[ -z "${!name}" ]]; then
              echo "::error title=Missing signing secret::Configure $name in the release environment of this repository."
              exit 1
            fi
          done

      - name: Check out pinned release pipeline
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.preflight.outputs.pipeline_sha }}
          path: pipeline

      - name: Check out exact tagged application sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: refs/tags/${{ needs.preflight.outputs.release_tag }}
          path: app-source

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@90ddb51e90a5fd9ba75f40cf85156b7b41bf76a3 # v6

      - name: Set up JDK 17
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
          cache-dependency-path: |
            app-source/**/*.gradle
            app-source/gradle/wrapper/gradle-wrapper.properties
            app-source/gradle.properties

      - name: Set up Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4
        with:
          packages: platform-tools

      - name: Install Android build dependencies
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Derive packaged versionName from the release tag
        run: |
          bash pipeline/tools/prepare_release_source.sh "$RELEASE_TAG" app-source/app/build.gradle
          echo "Release automation commit: \`$PIPELINE_SHA\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Test and lint tagged release sources
        working-directory: app-source
        run: ./gradlew testDebugUnitTest lintRelease --stacktrace

      - name: Restore and validate release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          RELEASE_STORE_FILE: ${{ runner.temp }}/day-meter-release.jks
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
        run: |
          umask 077
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RELEASE_STORE_FILE"
          test -s "$RELEASE_STORE_FILE"
          keytool -list -keystore "$RELEASE_STORE_FILE" -storepass "$RELEASE_STORE_PASSWORD" -alias "$RELEASE_KEY_ALIAS" >/dev/null

      - name: Build signed APK and Android App Bundle
        working-directory: app-source
        env:
          RELEASE_STORE_FILE: ${{ runner.temp }}/day-meter-release.jks
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew assembleRelease bundleRelease --stacktrace

      - name: Remove release keystore
        if: always()
        run: rm -f "${{ runner.temp }}/day-meter-release.jks"

      - name: Verify packaged APK versionName and source commit
        run: |
          if [[ "$(git -C app-source rev-parse HEAD)" != "$TAGGED_SHA" ]]; then
            echo "::error title=Source provenance mismatch::The APK was not built from the validated tagged commit."
            exit 1
          fi
          expected="${RELEASE_TAG#v}"
          badging="$("$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging app-source/app/build/outputs/apk/release/app-release.apk)"
          package_line="$(sed -n '/^package:/p' <<< "$badging")"
          actual="$(sed -nE "s/.*versionName='([^']+)'.*/\1/p" <<< "$package_line")"
          if [[ "$actual" != "$expected" ]]; then
            echo "::error title=Packaged Android version mismatch::APK versionName '$actual' does not match release tag '$RELEASE_TAG'."
            exit 1
          fi
          echo "Signed APK versionName $actual matches $RELEASE_TAG (tagged commit $TAGGED_SHA)."

      - name: Prepare checksummed release artifacts
        run: |
          mkdir -p pipeline/dist
          cp app-source/app/build/outputs/apk/release/app-release.apk "pipeline/dist/day-meter-${RELEASE_TAG}.apk"
          cp app-source/app/build/outputs/bundle/release/app-release.aab "pipeline/dist/day-meter-${RELEASE_TAG}.aab"
          (cd pipeline/dist && sha256sum --binary "day-meter-${RELEASE_TAG}.apk" "day-meter-${RELEASE_TAG}.aab" > "day-meter-${RELEASE_TAG}-SHA256SUMS.txt")

      - name: Attest verified release artifacts
        uses: actions/attest@36051bcae73b7c2a8a6945a48cbf80953c6baa35 # v4
        with:
          subject-path: |
            pipeline/dist/*.apk
            pipeline/dist/*.aab
            pipeline/dist/*-SHA256SUMS.txt

      - name: Publish or safely repair the GitHub Release
        working-directory: pipeline
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash tools/publish_release.sh "$RELEASE_TAG"
